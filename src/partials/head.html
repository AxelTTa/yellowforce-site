<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{page_title}}</title>
<meta name="description" content="{{description_attr}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{ogtype}}">
<meta property="og:site_name" content="YellowForce">
<meta property="og:title" content="{{title_attr}}">
<meta property="og:description" content="{{description_attr}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="YellowForce. Fight AI with AI. 24/7.">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title_attr}}">
<meta name="twitter:description" content="{{description_attr}}">
<meta name="twitter:image" content="{{og_image}}">
<meta name="twitter:image:alt" content="YellowForce. Fight AI with AI. 24/7.">
<meta name="theme-color" content="#071B3E">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://yellow-force.com/#organization",
      "name": "YellowForce",
      "url": "https://yellow-force.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://yellow-force.com/icon-512.png",
        "width": 512,
        "height": 512
      },
      "image": "https://yellow-force.com/assets/img/og.png",
      "email": "info@yellow-force.com",
      "description": "Fully managed cybersecurity. Our AI and our experts stop every threat, AI swarms included. 24/7.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "San Francisco",
        "addressRegion": "CA",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "info@yellow-force.com",
        "hoursAvailable": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        }
      }
    },
    {
      "@type": "WebSite",
      "@id": "https://yellow-force.com/#website",
      "name": "YellowForce",
      "url": "https://yellow-force.com/",
      "publisher": { "@id": "https://yellow-force.com/#organization" },
      "inLanguage": "en-US"
    }
  ]
}
</script>
<link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
